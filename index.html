<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMOU MATH | منصة الرياضيات العالمية</title>

<meta name="description"
content="HAMOU MATH منصة عالمية لتعلم الرياضيات، الدروس، التمارين، الاختبارات، التحديات والألعاب." />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#101828;
  --muted:#667085;
  --primary:#635bff;
  --primary2:#7c3aed;
  --border:#e4e7ec;
  --success:#12b76a;
  --danger:#f04438;
  --shadow:0 10px 30px rgba(16,24,40,.08);
  --radius:20px;
}

body{
  font-family:
  Arial,
  "Noto Sans Arabic",
  sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:10px 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:21px;
  white-space:nowrap;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 8px 20px rgba(99,91,255,.25);
}

.nav-links{
  display:flex;
  gap:5px;
  align-items:center;
}

.nav-links button{
  border:0;
  background:transparent;
  padding:9px 12px;
  border-radius:10px;
  color:#344054;
}

.nav-links button:hover{
  background:#f2f4f7;
}

.nav-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.lang{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  padding:8px 10px;
}

.primary{
  border:0;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  padding:11px 17px;
  border-radius:12px;
  font-weight:700;
}

.secondary{
  border:1px solid var(--border);
  background:white;
  padding:11px 17px;
  border-radius:12px;
  font-weight:700;
}

.menu-btn{
  display:none;
  border:0;
  background:white;
  font-size:24px;
}

/* HERO */

.hero{
  max-width:1250px;
  margin:30px auto 0;
  padding:55px 25px;
  border-radius:30px;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(circle at 90% 10%,rgba(124,58,237,.35),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(99,91,255,.28),transparent 30%),
    #111827;
  color:white;
}

.hero-content{
  max-width:750px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px;
  border-radius:50px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  margin-bottom:18px;
  font-size:14px;
}

.hero h1{
  font-size:clamp(34px,6vw,65px);
  line-height:1.08;
  margin-bottom:18px;
}

.hero h1 span{
  background:linear-gradient(90deg,#a78bfa,#67e8f9);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#d0d5dd;
  font-size:18px;
  max-width:680px;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.hero .secondary{
  background:rgba(255,255,255,.1);
  color:white;
  border-color:rgba(255,255,255,.2);
}

/* STATS */

.stats{
  max-width:1250px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:0 18px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat strong{
  display:block;
  font-size:27px;
  margin-bottom:4px;
}

.stat span{
  color:var(--muted);
  font-size:14px;
}

/* MAIN */

main{
  max-width:1250px;
  margin:auto;
  padding:20px 18px 70px;
}

.section{
  margin-top:45px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}

.section-head h2{
  font-size:28px;
}

.section-head p{
  color:var(--muted);
}

/* LIBRARY */

.library-tools{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  display:grid;
  grid-template-columns:2fr repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.input,
.select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:white;
}

.input:focus,
.select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.1);
}

.resources{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.resource{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  transition:.2s;
  box-shadow:0 5px 18px rgba(16,24,40,.04);
}

.resource:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.resource-type{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#f2f4f7;
  color:#475467;
  font-size:12px;
  margin-bottom:12px;
}

.resource h3{
  font-size:19px;
  margin-bottom:8px;
}

.resource p{
  color:var(--muted);
  font-size:14px;
  min-height:45px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:15px 0;
}

.meta span{
  background:#f8f9fc;
  border:1px solid #eaecf0;
  border-radius:8px;
  padding:4px 8px;
  font-size:12px;
  color:#475467;
}

.resource-actions{
  display:flex;
  gap:8px;
}

.resource-actions button{
  flex:1;
}

/* EMPTY */

.empty{
  text-align:center;
  background:white;
  border:1px dashed var(--border);
  border-radius:20px;
  padding:50px 20px;
  color:var(--muted);
}

/* CHALLENGES */

.challenges{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.challenge{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.challenge .difficulty{
  color:var(--primary);
  font-size:13px;
  font-weight:bold;
}

.challenge h3{
  margin:8px 0;
}

.challenge-question{
  margin:15px 0;
  font-weight:bold;
}

.options{
  display:grid;
  gap:8px;
}

.option{
  border:1px solid var(--border);
  background:#fafafa;
  padding:11px;
  border-radius:10px;
  text-align:right;
}

.option:hover{
  border-color:var(--primary);
  background:#f7f5ff;
}

/* GAMES */

.games{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.game{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px 14px;
  text-align:center;
}

.game-icon{
  font-size:38px;
  margin-bottom:10px;
}

.game h3{
  font-size:16px;
  margin-bottom:10px;
}

/* PROFILE */

.profile{
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  box-shadow:var(--shadow);
}

.profile-top{
  display:flex;
  align-items:center;
  gap:18px;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:22px;
  display:grid;
  place-items:center;
  color:white;
  font-size:27px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.profile-name{
  font-size:23px;
  font-weight:800;
}

.profile-email{
  color:var(--muted);
  font-size:14px;
}

.progress{
  margin-top:22px;
  height:10px;
  background:#eaecf0;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  transition:.5s;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px;
}

.profile-stat{
  background:#f8f9fc;
  padding:13px;
  border-radius:12px;
  text-align:center;
}

.profile-stat strong{
  display:block;
  font-size:19px;
}

/* PREMIUM */

.premium{
  border-radius:25px;
  padding:35px;
  color:white;
  background:
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.2),transparent
